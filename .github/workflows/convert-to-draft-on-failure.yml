name: Convert PR to Draft on Failure

on:
  workflow_run:
    workflows: ["Tests", "pytest"] # Triggers on completion of the pytest workflow
    types:
      - completed

jobs:
  convert-to-draft:
    runs-on: ubuntu-latest
    # Only run if the triggering workflow failed
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    permissions:
      pull-requests: write
      actions: read
    steps:
      - name: Convert PR to Draft via GraphQL
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          REPO_NAME: ${{ github.repository }}
        run: |
          # Exit if no PR is associated with the workflow run (e.g., push to main)
          if [ -z "$PR_NUMBER" ]; then
            echo "No associated PR found. Skipping."
            exit 0
          fi

          echo "Workflow failed for PR #${PR_NUMBER}. Converting to draft..."

          # 1. Get the Pull Request details
          QUERY_RESPONSE=$(curl -s -X POST -H "Authorization: bearer $GITHUB_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{ \"query\": \"query { repository(owner: \\\"${REPO_NAME%/*}\\\", name: \\\"${REPO_NAME#*/}\\\") { pullRequest(number: $PR_NUMBER) { id isDraft } } }\" }" \
            https://api.github.com/graphql)

          if [ "$(echo "$QUERY_RESPONSE" | jq '(.errors // []) | length')" -gt 0 ]; then
            echo "Failed to retrieve PR details:"
            echo "$QUERY_RESPONSE" | jq '.errors'
            exit 1
          fi

          NODE_ID=$(echo "$QUERY_RESPONSE" | jq -r '.data.repository.pullRequest.id')
          IS_DRAFT=$(echo "$QUERY_RESPONSE" | jq -r '.data.repository.pullRequest.isDraft')

          if [ "$NODE_ID" == "null" ] || [ -z "$NODE_ID" ]; then
            echo "Failed to retrieve Node ID."
            exit 1
          fi

          if [ "$IS_DRAFT" = "true" ]; then
            echo "PR #${PR_NUMBER} is already a draft. Skipping."
            exit 0
          fi

          # 2. Execute the mutation to convert to draft
          MUTATION_RESPONSE=$(curl -s -X POST -H "Authorization: bearer $GITHUB_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{ \"query\": \"mutation { convertPullRequestToDraft(input: {pullRequestId: \\\"$NODE_ID\\\"}) { pullRequest { id number isDraft } } }\" }" \
            https://api.github.com/graphql)

          if [ "$(echo "$MUTATION_RESPONSE" | jq '(.errors // []) | length')" -gt 0 ]; then
            echo "Failed to convert PR #${PR_NUMBER} to a draft:"
            echo "$MUTATION_RESPONSE" | jq '.errors'
            exit 1
          fi

          if [ "$(echo "$MUTATION_RESPONSE" | jq -r '.data.convertPullRequestToDraft.pullRequest.isDraft')" != "true" ]; then
            echo "PR #${PR_NUMBER} was not converted to a draft."
            exit 1
          fi

          echo "PR #${PR_NUMBER} has been converted to a draft."
